  <rect x="12" y="14" width="7" height="36" rx="3.5" fill="#ff7a00"/>
  <text x="26" y="41" font-family="Segoe UI,system-ui,sans-serif"
        font-size="25" font-weight="800" fill="#f2f2f2">V</text>
  <text x="42" y="41" font-family="Segoe UI,system-ui,sans-serif"
        font-size="25" font-weight="800" fill="#ff7a00">X</text>
</svg>
